upstream users { server user-service:8000; }
upstream products { server product-service:8000; }
upstream orders { server order-service:8000; }
server {
  listen 80;
  server_name _;
  location = /health { return 200 "gateway-ok\n"; add_header Content-Type text/plain; }
  location /users/ { proxy_pass http://users/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /products/ { proxy_pass http://products/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /orders/ { proxy_pass http://orders/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
}
